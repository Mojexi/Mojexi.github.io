<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پرسش‌نامه</title>
<style>
:root{--bg:#121212;--card:#1b1b1b;--line:#2b2b2b;--text:#f1f1f1;--muted:#8b8b8b;--ring:#8f8f8f;--warn:#e0a24a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.9;font-size:var(--fs-body,17px);font-family:"Vazirmatn","Vazir","IRANSans","Segoe UI",Tahoma,sans-serif}
main{max-width:var(--w,860px);margin:0 auto;padding:28px 16px 64px}
h1{font-size:calc(var(--fs-body,17px)*1.5);font-weight:700;margin:12px 0 18px;line-height:1.6}
.prose{color:#d6d6d6;margin:0 0 14px;white-space:pre-line}
.blocks ul{color:#d6d6d6;padding-inline-start:22px;margin:0 0 14px}
.blocks.center ul{list-style-position:inside;padding:0}
.btn{font:inherit;font-weight:600;background:var(--text);color:#151515;border:0;border-radius:12px;padding:12px 26px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:focus-visible,input:focus-visible+.dot,select:focus-visible,input[type=text]:focus-visible,.nopinion input:focus-visible+.box{outline:2px solid #e8e8e8;outline-offset:3px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.progress{color:var(--muted);font-size:14px;margin-bottom:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px 26px 20px;margin-bottom:22px}
.q.missing{border-color:var(--warn)}
.stem{text-align:center;font-size:var(--fs-stem,22px);font-weight:600;margin:0 0 24px}
.likert{display:grid;grid-template-columns:minmax(0,1fr) var(--sw,62%) minmax(0,1fr);grid-template-areas:"a s b" ". l .";column-gap:14px;align-items:center}
.pole{font-size:var(--fs-pole,18px);line-height:1.8;color:#e6e6e6}
.pole.a{grid-area:a;text-align:right}.pole.b{grid-area:b;text-align:left}
.slider{grid-area:s;position:relative;height:48px;margin:0 10%;cursor:pointer;touch-action:pan-y;outline:none;user-select:none;-webkit-user-select:none}
.rail{position:absolute;top:50%;right:0;left:0;height:12px;transform:translateY(-50%);background:#2e2e2e;border-radius:12px}
.tick{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:#5a5a5a;transform:translate(50%,-50%)}
.thumb{position:absolute;top:50%;width:38px;height:38px;transform:translate(50%,-50%);border-radius:50%;background:var(--card);border:3px solid var(--ring);transition:border-color .15s,background .15s}
.slider:not(.answered) .thumb{visibility:hidden}
.slider.answered .thumb{border-color:var(--text);background:#2a2a2a}
.slider:focus-visible .thumb{outline:2px solid #e8e8e8;outline-offset:3px}
.sl-labels{grid-area:l;display:flex;margin-top:4px}
.sl-labels .mid{flex:1;cursor:pointer;padding:0 2px}
.mid.on{color:var(--text);font-weight:600}
.mid{font-size:var(--fs-label,15px);color:#cfcfcf;text-align:center;line-height:1.6}
.q.off .slider,.q.off .sl-labels{opacity:.4}
.q hr{border:0;border-top:1px solid var(--line);margin:18px 0 14px}
.nopinion{display:flex;align-items:center;gap:12px;color:#cfcfcf;font-size:calc(var(--fs-body,17px)*1.05);cursor:pointer;width:fit-content;position:relative}
.nopinion input{position:absolute;opacity:0;width:0;height:0}
.nopinion .box{width:32px;height:32px;border-radius:9px;background:#000;border:3px solid var(--ring);display:grid;place-items:center}
.nopinion input:checked+.box::after{content:"";width:7px;height:14px;margin-top:-3px;border:solid var(--text);border-width:0 3px 3px 0;transform:rotate(45deg)}
.hint{color:var(--warn);font-size:15px;margin:12px 0 0;display:none}
.q.missing .hint{display:block}
.plabel{font-size:calc(var(--fs-body,17px)*1.05);font-weight:600;margin-bottom:10px}
.pq{padding:22px 24px;border-radius:20px}
.pq input[type=text],.pq select{width:100%;font:inherit;color:var(--text);background:#000;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{position:relative;cursor:pointer}
.choice input{position:absolute;opacity:0;width:0;height:0}
.choice span{display:block;border:1px solid var(--line);border-radius:12px;padding:6px 16px;background:#000}
.choice input:checked+span{background:var(--text);color:#151515;border-color:var(--text)}
.choice input:focus-visible+span{outline:2px solid #e8e8e8;outline-offset:2px}
.note{color:var(--muted);font-size:15px}
textarea{width:100%;min-height:110px;direction:ltr;text-align:left;background:var(--card);color:#d6d6d6;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.6 ui-monospace,Consolas,monospace}
.lnk{color:#9ecbff;text-decoration:underline;cursor:pointer}
.flash{margin-top:14px}
[hidden]{display:none!important}
@media (max-width:560px){.q{padding:22px 14px 16px;border-radius:20px}.stem{font-size:calc(var(--fs-stem,22px)*.85)}.likert{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "s s" "l l";column-gap:14px;row-gap:6px}.pole{font-size:calc(var(--fs-pole,18px)*.88)}.thumb{width:32px;height:32px}.mid{font-size:calc(var(--fs-label,15px)*.8)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function respondentApp(C) {
  const M = C.meta, B = M.btn;
  const F = M.fs || {}, rs = document.documentElement.style;
  rs.setProperty("--w", (M.width || 860) + "px");
  rs.setProperty("--fs-body", (F.body || 17) + "px");
  rs.setProperty("--fs-stem", (F.stem || 22) + "px");
  rs.setProperty("--fs-pole", (F.pole || 18) + "px");
  rs.setProperty("--fs-label", (F.label || 15) + "px");
  rs.setProperty("--sw", (M.sliderWidth || 62) + "%");
  const items = C.likert.items;
  const pitems = C.profile.enabled ? C.profile.items : [];
  const app = document.getElementById("app");
  const fa = n => Number(n).toLocaleString("fa-IR");
  const mk = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const lines = s => String(s || "").split("\n").map(x => x.trim()).filter(Boolean);

  const S = { p: pitems.map(() => ""), q: items.map(() => ({ v: null, none: false })) };
  const pages = [{ kind: "intro" }];
  if (pitems.length) pages.push({ kind: "profile" });
  const per = M.perPage > 0 ? M.perPage : Math.max(items.length, 1);
  for (let i = 0; i < items.length; i += per) pages.push({ kind: "likert", from: i, to: Math.min(i + per, items.length) });
  pages.push({ kind: "outro" });
  let cur = 0, csv = "";
  let cards = [], check = () => true, progressEl = null;

  /* ذخیره بی‌صدای پیشرفت: اگر مرورگر صفحه را دوباره بارگذاری کرد، از همان‌جا ادامه می‌دهد */
  const KEY = "qn:" + (str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); })(
    JSON.stringify([M.title, items.map(q => [q.stem, q.a, q.b]), pitems.map(q => q.l)]));
  const TTL = 3 * 3600 * 1000;
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), cur, csv, p: S.p, q: S.q })); } catch (e) {} };
  const forget = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
  try {
    const sv = JSON.parse(localStorage.getItem(KEY) || "null");
    if (sv && Date.now() - sv.t < TTL && sv.q.length === S.q.length && sv.p.length === S.p.length && sv.cur >= 0 && sv.cur < pages.length) {
      S.p = sv.p.map(x => String(x ?? ""));
      sv.q.forEach((a, i) => { S.q[i] = { v: typeof a.v === "number" ? a.v : null, none: !!a.none }; });
      cur = sv.cur; csv = sv.csv || "";
      if (pages[cur].kind === "outro" && !csv) csv = buildCsv();
    }
  } catch (e) {}

  function blocks(pg) {
    const w = mk("div", "blocks" + (pg.align === "center" ? " center" : ""));
    pg.blocks.forEach(b => {
      if (b.t === "h") w.append(mk("h1", "", b.x));
      else if (b.t === "ul") { const u = mk("ul"); lines(b.x).forEach(s => u.append(mk("li", "", s))); w.append(u); }
      else if (b.t === "link") {
        const pp = mk("p", "prose"), a = mk("a", "lnk", b.x || "پیوند");
        a.href = "#"; a.onclick = e => { e.preventDefault(); sendTo(b.kind, b.v, b.subj); };
        pp.append(a); w.append(pp);
      }
      else w.append(mk("p", "prose", b.x));
    });
    return w;
  }
  let revealFn = () => {};
  function mkFile() { return new File(["\ufeff" + csv], (M.fileName || "answers") + "-" + Date.now() + ".csv", { type: "text/csv" }); }
  function flash(text) {
    let fl = document.getElementById("flash");
    if (!fl) { fl = mk("p", "note flash"); fl.id = "flash"; app.append(fl); }
    fl.textContent = text;
  }
  function destUrl(kind, v, subj) {
    const t = csv || "", enc = encodeURIComponent;
    v = (v || "").trim(); subj = subj || M.title || "";
    if (kind === "email") return "mailto:" + v + "?subject=" + enc(subj) + "&body=" + enc(t);
    if (kind === "gmail") return "https://mail.google.com/mail/?view=cm&fs=1&to=" + enc(v) + "&su=" + enc(subj) + "&body=" + enc(t);
    if (kind === "whatsapp") return "https://wa.me/" + v.replace(/\D/g, "") + "?text=" + enc(t);
    if (kind === "telegram_pick") return "https://t.me/share/url?url=%20&text=" + enc(t);
    if (kind === "telegram_user") return "https://t.me/" + v.replace(/^https?:\/\/t\.me\//, "").replace(/^@/, "");
    return v.split("{answers}").join(enc(t)).split("{subject}").join(enc(subj));
  }
  async function sendTo(kind, v, subj) {
    if (kind === "share") {
      try {
        if (navigator.share) {
          const f = mkFile();
          if (!navigator.canShare || navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: M.title }); forget(); return; }
        }
      } catch (e) { if (e && e.name === "AbortError") return; }
      try { await navigator.clipboard.writeText(csv); flash("متن پاسخ‌ها کپی شد."); } catch (e) {}
      revealFn(); return;
    }
    if (kind === "telegram_user") {
      try { await navigator.clipboard.writeText(csv); flash("متن پاسخ‌ها کپی شد. در گفتگوی تلگرام بچسبانید و ارسال کنید."); } catch (e) { revealFn(); }
    }
    const url = destUrl(kind, v, subj);
    if (kind === "email") { location.href = url; return; }
    const w = window.open(url, "_blank");
    if (w) w.opener = null; else location.href = url;
  }
  function nav(list) {
    const a = mk("div", "actions");
    list.forEach(([t, cls, fn]) => { const b = mk("button", "btn " + (cls || ""), t); b.onclick = fn; a.append(b); });
    return a;
  }
  function esc(v) {
    let s = v == null ? "" : String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function buildCsv() {
    const head = ["submitted_at"], row = [new Date().toISOString()];
    pitems.forEach((it, i) => { head.push(it.code || "p" + (i + 1)); row.push(S.p[i]); });
    items.forEach((it, i) => { head.push(it.code || "q" + (i + 1)); row.push(S.q[i].none ? "NA" : S.q[i].v); });
    return head.map(esc).join(",") + "\n" + row.map(esc).join(",") + "\n";
  }

  function renderProfile() {
    cards = [];
    app.append(mk("h1", "", C.profile.title));
    if (C.profile.desc) app.append(mk("p", "prose", C.profile.desc));
    pitems.forEach((it, i) => {
      const card = mk("div", "q pq");
      card.append(mk("div", "plabel", it.l + (it.r ? " *" : "")));
      const touch = () => { card.classList.remove("missing"); persist(); };
      if (it.type === "text") {
        const inp = mk("input"); inp.type = "text"; inp.value = S.p[i];
        inp.oninput = () => { S.p[i] = inp.value; touch(); };
        card.append(inp);
      } else if (it.type === "select") {
        const sel = mk("select");
        const o0 = mk("option", "", "انتخاب کنید"); o0.value = ""; sel.append(o0);
        lines(it.o).forEach(o => { const op = mk("option", "", o); op.value = o; sel.append(op); });
        sel.value = S.p[i];
        sel.onchange = () => { S.p[i] = sel.value; touch(); };
        card.append(sel);
      } else {
        const g = mk("div", "choices");
        lines(it.o).forEach(o => {
          const lb = mk("label", "choice");
          const r = document.createElement("input");
          r.type = "radio"; r.name = "p" + i; r.value = o; r.checked = S.p[i] === o;
          r.onchange = () => { S.p[i] = o; touch(); };
          lb.append(r, mk("span", "", o)); g.append(lb);
        });
        card.append(g);
      }
      card.append(mk("p", "hint", "لطفاً این مورد را تکمیل کنید."));
      cards.push([card, () => !it.r || String(S.p[i]).trim() !== ""]);
      app.append(card);
    });
    check = () => cards.map(([c, ok]) => { const bad = !ok(); c.classList.toggle("missing", bad); return bad ? c : null; }).filter(Boolean);
  }

  function updProgress() {
    if (!progressEl) return;
    const done = S.q.filter(a => a.none || a.v !== null).length;
    progressEl.textContent = fa(done) + " از " + fa(items.length) + " سوال پاسخ داده شده";
  }

  function renderLikert(pg) {
    cards = [];
    progressEl = mk("div", "progress");
    app.append(progressEl);
    const free = M.slider === "free";
    const toVal = f => { const x = f * 4; return Math.round((M.start === "left" ? 5 - x : x + 1) * 100) / 100; };
    const toF = v => (M.start === "left" ? 5 - v : v - 1) / 4;
    for (let i = pg.from; i < pg.to; i++) {
      const it = items[i], st = S.q[i];
      const card = mk("div", "q");
      if (it.stem) card.append(mk("p", "stem", it.stem));
      const row = mk("div", "likert");
      const sl = mk("div", "slider");
      sl.setAttribute("role", "slider");
      sl.setAttribute("aria-valuemin", "1"); sl.setAttribute("aria-valuemax", "5");
      sl.tabIndex = st.none ? -1 : 0;
      sl.append(mk("div", "rail"));
      for (let k = 0; k < 5; k++) { const t = mk("span", "tick"); t.style.right = (k * 25) + "%"; sl.append(t); }
      const thumb = mk("div", "thumb"); sl.append(thumb);
      const labs = mk("div", "sl-labels");
      const labEls = [0, 1, 2, 3, 4].map(pos => { const d = mk("div", "mid", (it.labels || M.defaultLabels)[pos] || ""); labs.append(d); return d; });
      const draw = () => {
        const has = st.v !== null, f = has ? toF(st.v) : 0.5;
        thumb.style.right = (f * 100) + "%";
        sl.classList.toggle("answered", has);
        sl.setAttribute("aria-valuenow", has ? st.v : "");
        const cp = has && !free ? Math.round(f * 4) : -1;
        labEls.forEach((d, k) => d.classList.toggle("on", k === cp));
      };
      const setF = f => {
        f = Math.max(0, Math.min(1, f));
        if (!free) f = Math.round(f * 4) / 4;
        st.v = toVal(f); card.classList.remove("missing"); draw(); updProgress(); persist();
      };
      let drag = false;
      const fromEvent = e => { const r = sl.getBoundingClientRect(); setF((r.right - e.clientX) / r.width); };
      sl.addEventListener("pointerdown", e => { if (st.none) return; drag = true; sl.setPointerCapture(e.pointerId); fromEvent(e); });
      sl.addEventListener("pointermove", e => { if (drag) fromEvent(e); });
      sl.addEventListener("pointerup", () => { drag = false; });
      sl.addEventListener("pointercancel", () => { drag = false; });
      sl.addEventListener("click", e => { if (!st.none && st.v === null) fromEvent(e); });
      sl.addEventListener("keydown", e => {
        if (st.none) return;
        if (st.v === null && e.key.startsWith("Arrow")) { e.preventDefault(); setF(0.5); return; }
        const cur = st.v === null ? 0.5 : toF(st.v), step = free ? 0.025 : 0.25;
        let n;
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") n = cur + step;
        else if (e.key === "ArrowRight" || e.key === "ArrowDown") n = cur - step;
        else if (e.key === "Home") n = 0;
        else if (e.key === "End") n = 1;
        else return;
        e.preventDefault(); setF(n);
      });
      labEls.forEach((d, k) => { d.onclick = () => { if (!st.none) setF(k / 4); }; });
      row.append(mk("div", "pole a", it.a || ""), sl, mk("div", "pole b", it.b || ""), labs);
      card.append(row);
      draw();
      card.append(mk("hr"));
      const nl = mk("label", "nopinion");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = st.none;
      cb.onchange = () => {
        st.none = cb.checked;
        if (cb.checked) { st.v = null; card.classList.remove("missing"); }
        card.classList.toggle("off", cb.checked);
        sl.tabIndex = cb.checked ? -1 : 0;
        draw();
        updProgress();
        persist();
      };
      nl.append(cb, mk("span", "box"), mk("span", "", M.noOpinion));
      card.append(nl);
      card.append(mk("p", "hint", "لطفاً یک گزینه را انتخاب کنید یا «" + M.noOpinion + "» را بزنید."));
      card.classList.toggle("off", st.none);
      cards.push([card, () => st.none || st.v !== null]);
      app.append(card);
    }
    updProgress();
    check = () => cards.map(([c, ok]) => { const bad = !ok(); c.classList.toggle("missing", bad); return bad ? c : null; }).filter(Boolean);
  }

  function renderOutro() {
    app.append(blocks(C.outro));
    const note = mk("p", "note", "اگر دانلود در مرورگر شما کار نکرد، متن زیر را کپی کنید و در پیام یا ایمیل بفرستید.");
    const ta = mk("textarea"); ta.readOnly = true; ta.value = csv;
    note.hidden = true; ta.hidden = true;
    const reveal = () => { note.hidden = false; ta.hidden = false; };
    revealFn = reveal;
    const O = M.out || {};
    const on = k => O[k] !== false;
    const kind = O.shareKind || "share";
    let canShare = false;
    try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [mkFile()] })); } catch (e) {}
    const list = [];
    if (on("share") && (kind !== "share" || canShare)) list.push([B.share || "ارسال پاسخ‌ها", "", () => sendTo(kind, O.shareValue, O.shareSubject)]);
    if (on("download")) list.push([B.download, list.length ? "ghost" : "", () => {
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const l = document.createElement("a");
      l.href = url; l.download = (M.fileName || "answers") + "-" + Date.now() + ".csv";
      document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      reveal();
    }]);
    if (on("copy")) list.push([B.copy, list.length ? "ghost" : "", async () => {
      reveal();
      try { await navigator.clipboard.writeText(csv); } catch (e) { ta.select(); }
    }]);
    const a = nav(list);
    app.append(a, note, ta);
  }

  function go(d) {
    if (d > 0 && pages[cur].kind !== "intro") {
      const bad = check();
      if (bad.length) { bad[0].scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    }
    cur += d;
    if (pages[cur].kind === "outro") csv = buildCsv();
    persist();
    render();
  }
  function render() {
    app.replaceChildren();
    progressEl = null; check = () => [];
    const pg = pages[cur];
    if (pg.kind === "intro") {
      app.append(blocks(C.intro), nav([[B.start, "", () => go(1)]]));
    } else if (pg.kind === "outro") {
      renderOutro();
    } else {
      if (pg.kind === "profile") renderProfile(); else renderLikert(pg);
      const last = pages[cur + 1].kind === "outro";
      app.append(nav([[last ? B.finish : B.next, "", () => go(1)], [B.back, "ghost", () => go(-1)]]));
    }
    window.scrollTo(0, 0);
